<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>How the KV cache moves when a new token is generated</title>
  <rect width="780" height="380" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#1f2328">How the KV cache moves when a new token is generated</text>
  <text x="24" y="56" font-size="12" fill="#57606a">The KV cache always lives in VRAM; computation pulls it onto the chip one tile at a time and discards it after use</text>
  <rect x="24" y="80" width="250" height="250" rx="8" fill="#0072B2" fill-opacity="0.1" stroke="#0072B2"/>
  <text x="36" y="102" font-size="14" font-weight="bold" fill="#0072B2">VRAM (global memory)</text>
  <text x="36" y="124" font-size="11" fill="#1f2328">KV cache: one per layer per past token</text>
  <rect x="44" y="136" width="210" height="22" fill="#0072B2" fill-opacity="0.35"/>
  <rect x="44" y="136" width="52" height="22" fill="#0072B2"/>
  <text x="50" y="151" font-size="11" fill="#ffffff">tile 1</text>
  <text x="104" y="151" font-size="11" fill="#1f2328">tile 2 … tile n (K)</text>
  <rect x="44" y="164" width="210" height="22" fill="#009E73" fill-opacity="0.35"/>
  <rect x="44" y="164" width="52" height="22" fill="#009E73"/>
  <text x="50" y="179" font-size="11" fill="#ffffff">tile 1</text>
  <text x="104" y="179" font-size="11" fill="#1f2328">tile 2 … tile n (V)</text>
  <text x="36" y="214" font-size="11" fill="#1f2328">Model weights: 2.32 GiB (Qwen3-4B Q4_K_M)</text>
  <rect x="44" y="224" width="210" height="22" fill="#57606a" fill-opacity="0.4"/>
  <text x="36" y="274" font-size="11" fill="#57606a">Every new token reads all weights</text>
  <text x="36" y="292" font-size="11" fill="#57606a">and the whole KV history from here</text>
  <text x="36" y="310" font-size="11" fill="#57606a">→ decode is usually bandwidth-bound</text>
  <line x1="274" y1="160" x2="360" y2="160" stroke="#1f2328" stroke-width="2"/>
  <polygon points="352,154 364,160 352,166" fill="#1f2328"/>
  <text x="280" y="150" font-size="11" fill="#1f2328">① load a tile</text>
  <rect x="364" y="80" width="190" height="160" rx="8" fill="#E69F00" fill-opacity="0.15" stroke="#E69F00"/>
  <text x="376" y="102" font-size="14" font-weight="bold" fill="#b06d00">Shared memory / L1</text>
  <text x="376" y="124" font-size="11" fill="#1f2328">holds the current K, V tile</text>
  <rect x="384" y="136" width="52" height="22" fill="#0072B2"/>
  <rect x="444" y="136" width="52" height="22" fill="#009E73"/>
  <text x="376" y="186" font-size="11" fill="#1f2328">threads in one SM reuse</text>
  <text x="376" y="204" font-size="11" fill="#1f2328">this tile together</text>
  <line x1="554" y1="160" x2="610" y2="160" stroke="#1f2328" stroke-width="2"/>
  <polygon points="602,154 614,160 602,166" fill="#1f2328"/>
  <text x="560" y="150" font-size="11" fill="#1f2328">② fetch</text>
  <rect x="614" y="80" width="146" height="160" rx="8" fill="#D55E00" fill-opacity="0.12" stroke="#D55E00"/>
  <text x="626" y="102" font-size="14" font-weight="bold" fill="#D55E00">Registers</text>
  <text x="626" y="124" font-size="11" fill="#1f2328">③ compute: score the</text>
  <text x="626" y="142" font-size="11" fill="#1f2328">new token's Q against</text>
  <text x="626" y="160" font-size="11" fill="#1f2328">this K tile, add up V</text>
  <text x="626" y="190" font-size="11" fill="#1f2328">④ keep only the running</text>
  <text x="626" y="208" font-size="11" fill="#1f2328">sum; next tile</text>
  <rect x="364" y="262" width="396" height="94" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="376" y="284" font-size="12" font-weight="bold" fill="#1f2328">This is exactly what FlashAttention does</text>
  <text x="376" y="304" font-size="11" fill="#1f2328">Attention is split into tiles computed in shared</text>
  <text x="376" y="322" font-size="11" fill="#1f2328">memory and registers; the huge matrix never goes</text>
  <text x="376" y="340" font-size="11" fill="#1f2328">back to VRAM. New K and V are appended to the cache.</text>
</svg>
