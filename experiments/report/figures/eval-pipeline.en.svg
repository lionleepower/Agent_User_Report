<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>The journey of one question: how the evaluation works</title>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="24" y="34" font-size="19" font-weight="bold" fill="#1f2328">The journey of one question: how the experiments decide "which is better"</text>
  <text x="24" y="58" font-size="12" fill="#57606a">Every question goes through this flow; each method answers the same question (twice each in round 2), and only the compared step changes</text>

  <rect x="24" y="80" width="170" height="150" rx="8" fill="#0072B2" fill-opacity="0.1" stroke="#0072B2"/>
  <text x="36" y="102" font-size="14" font-weight="bold" fill="#0072B2">① Question bank</text>
  <text x="36" y="124" font-size="11" fill="#1f2328">Q: How does TCP/IP</text>
  <text x="36" y="140" font-size="11" fill="#1f2328">layering differ from OSI?</text>
  <text x="36" y="162" font-size="11" fill="#1f2328">Points: only four layers;</text>
  <text x="36" y="178" font-size="11" fill="#1f2328">link + physical merged…</text>
  <text x="36" y="200" font-size="11" fill="#1f2328">Gold passage:</text>
  <text x="36" y="216" font-size="11" fill="#1f2328">"Architecture › TCP/IP"</text>

  <rect x="24" y="250" width="170" height="70" rx="8" fill="#CC79A7" fill-opacity="0.12" stroke="#CC79A7"/>
  <text x="36" y="272" font-size="13" font-weight="bold" fill="#a0507f">Optional: spoken version</text>
  <text x="36" y="292" font-size="11" fill="#1f2328">"um that tee-see-pee ip</text>
  <text x="36" y="308" font-size="11" fill="#1f2328">vs oh-ess-eye layers…"</text>

  <line x1="194" y1="155" x2="232" y2="155" stroke="#1f2328" stroke-width="2"/>
  <polygon points="226,149 238,155 226,161" fill="#1f2328"/>

  <rect x="238" y="80" width="200" height="240" rx="8" fill="#E69F00" fill-opacity="0.12" stroke="#E69F00"/>
  <text x="250" y="102" font-size="13" font-weight="bold" fill="#b06d00">② Fetch material (compared)</text>
  <rect x="252" y="116" width="172" height="36" rx="5" fill="#ffffff" stroke="#0072B2"/>
  <text x="262" y="138" font-size="12" fill="#1f2328">Whole: send everything</text>
  <rect x="252" y="160" width="172" height="36" rx="5" fill="#ffffff" stroke="#E69F00"/>
  <text x="262" y="182" font-size="12" fill="#1f2328">BM25: match keywords</text>
  <rect x="252" y="204" width="172" height="36" rx="5" fill="#ffffff" stroke="#009E73"/>
  <text x="262" y="226" font-size="12" fill="#1f2328">Dense: match meaning</text>
  <rect x="252" y="248" width="172" height="36" rx="5" fill="#ffffff" stroke="#D55E00"/>
  <text x="262" y="270" font-size="12" fill="#1f2328">PageIndex: read the outline</text>
  <text x="252" y="306" font-size="10" fill="#57606a">retrieval: ≤ 5 passages, 2000 chars</text>

  <line x1="438" y1="200" x2="476" y2="200" stroke="#1f2328" stroke-width="2"/>
  <polygon points="470,194 482,200 470,206" fill="#1f2328"/>

  <rect x="482" y="120" width="180" height="160" rx="8" fill="#009E73" fill-opacity="0.1" stroke="#009E73"/>
  <text x="494" y="142" font-size="14" font-weight="bold" fill="#007a59">③ Answer model</text>
  <text x="494" y="164" font-size="11" fill="#1f2328">Strict rule: answer only</text>
  <text x="494" y="180" font-size="11" fill="#1f2328">from the given material,</text>
  <text x="494" y="196" font-size="11" fill="#1f2328">spoken style, ≤ 150 chars;</text>
  <text x="494" y="212" font-size="11" fill="#1f2328">else "not in the material"</text>
  <text x="494" y="236" font-size="10" fill="#57606a">→ a retrieval miss becomes a</text>
  <text x="494" y="252" font-size="10" fill="#57606a">  wrong answer, never hidden</text>

  <line x1="662" y1="200" x2="700" y2="200" stroke="#1f2328" stroke-width="2"/>
  <polygon points="694,194 706,200 694,206" fill="#1f2328"/>

  <rect x="706" y="80" width="170" height="240" rx="8" fill="#56B4E9" fill-opacity="0.12" stroke="#56B4E9"/>
  <text x="718" y="102" font-size="14" font-weight="bold" fill="#1f6f99">④ Judge model</text>
  <text x="718" y="124" font-size="11" fill="#1f2328">Scores against the points:</text>
  <text x="718" y="148" font-size="12" font-weight="bold" fill="#007a59">2</text>
  <text x="740" y="148" font-size="11" fill="#1f2328">main points covered,</text>
  <text x="740" y="164" font-size="11" fill="#1f2328">no errors</text>
  <text x="718" y="190" font-size="12" font-weight="bold" fill="#b06d00">1</text>
  <text x="740" y="190" font-size="11" fill="#1f2328">partial, or small</text>
  <text x="740" y="206" font-size="11" fill="#1f2328">mistakes</text>
  <text x="718" y="232" font-size="12" font-weight="bold" fill="#D55E00">0</text>
  <text x="740" y="232" font-size="11" fill="#1f2328">wrong, empty, or</text>
  <text x="740" y="248" font-size="11" fill="#1f2328">"not in the material"</text>
  <text x="718" y="280" font-size="10" fill="#57606a">"Fully correct" = share</text>
  <text x="718" y="296" font-size="10" fill="#57606a">of answers scoring 2</text>

  <line x1="791" y1="320" x2="791" y2="350" stroke="#1f2328" stroke-width="2"/>
  <polygon points="785,344 791,356 797,344" fill="#1f2328"/>
  <rect x="24" y="356" width="852" height="60" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="36" y="378" font-size="14" font-weight="bold" fill="#1f2328">⑤ Statistics</text>
  <text x="124" y="378" font-size="12" fill="#1f2328">average repeats per question → failures count as wrong → resample questions 2000× for a 95% interval → pair methods</text>
  <text x="124" y="400" font-size="12" fill="#1f2328">also recorded: wait for the first answer token, total time, number of calls, tokens and cost</text>
</svg>
