<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <title>生成一个新 token 时 KV cache 的数据流</title>
  <rect width="780" height="380" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#1f2328">生成一个新 token 时，KV cache 怎么流动</text>
  <text x="24" y="56" font-size="12" fill="#57606a">KV cache 一直住在显存里；计算时按“块”（tile）搬进芯片，算完就丢，不会搬回去长期存放</text>
  <rect x="24" y="80" width="250" height="250" rx="8" fill="#0072B2" fill-opacity="0.1" stroke="#0072B2"/>
  <text x="36" y="102" font-size="14" font-weight="bold" fill="#0072B2">显存（全局内存）</text>
  <text x="36" y="124" font-size="11" fill="#1f2328">KV cache：每层、每个历史 token 一份</text>
  <rect x="44" y="136" width="210" height="22" fill="#0072B2" fill-opacity="0.35"/>
  <rect x="44" y="136" width="52" height="22" fill="#0072B2"/>
  <text x="50" y="151" font-size="11" fill="#ffffff">块 1</text>
  <text x="104" y="151" font-size="11" fill="#1f2328">块 2 … 块 n（K）</text>
  <rect x="44" y="164" width="210" height="22" fill="#009E73" fill-opacity="0.35"/>
  <rect x="44" y="164" width="52" height="22" fill="#009E73"/>
  <text x="50" y="179" font-size="11" fill="#ffffff">块 1</text>
  <text x="104" y="179" font-size="11" fill="#1f2328">块 2 … 块 n（V）</text>
  <text x="36" y="214" font-size="11" fill="#1f2328">模型权重：2.32 GiB（Qwen3-4B Q4_K_M）</text>
  <rect x="44" y="224" width="210" height="22" fill="#57606a" fill-opacity="0.4"/>
  <text x="36" y="274" font-size="11" fill="#57606a">每生成 1 个 token，全部权重</text>
  <text x="36" y="292" font-size="11" fill="#57606a">和全部历史 KV 都要从这里读一遍</text>
  <text x="36" y="310" font-size="11" fill="#57606a">→ decode 阶段通常卡在带宽上</text>
  <line x1="274" y1="160" x2="360" y2="160" stroke="#1f2328" stroke-width="2"/>
  <polygon points="352,154 364,160 352,166" fill="#1f2328"/>
  <text x="282" y="150" font-size="11" fill="#1f2328">① 搬一块</text>
  <rect x="364" y="80" width="190" height="160" rx="8" fill="#E69F00" fill-opacity="0.15" stroke="#E69F00"/>
  <text x="376" y="102" font-size="14" font-weight="bold" fill="#b06d00">共享内存 / L1</text>
  <text x="376" y="124" font-size="11" fill="#1f2328">放当前这一块 K、V</text>
  <rect x="384" y="136" width="52" height="22" fill="#0072B2"/>
  <rect x="444" y="136" width="52" height="22" fill="#009E73"/>
  <text x="376" y="186" font-size="11" fill="#1f2328">一个 SM 里的线程</text>
  <text x="376" y="204" font-size="11" fill="#1f2328">一起重复使用这块数据</text>
  <line x1="554" y1="160" x2="610" y2="160" stroke="#1f2328" stroke-width="2"/>
  <polygon points="602,154 614,160 602,166" fill="#1f2328"/>
  <text x="560" y="150" font-size="11" fill="#1f2328">② 取数</text>
  <rect x="614" y="80" width="146" height="160" rx="8" fill="#D55E00" fill-opacity="0.12" stroke="#D55E00"/>
  <text x="626" y="102" font-size="14" font-weight="bold" fill="#D55E00">寄存器</text>
  <text x="626" y="124" font-size="11" fill="#1f2328">③ 算：新 token 的 Q</text>
  <text x="626" y="142" font-size="11" fill="#1f2328">和这块 K 求相似度，</text>
  <text x="626" y="160" font-size="11" fill="#1f2328">再按权重累加这块 V</text>
  <text x="626" y="190" font-size="11" fill="#1f2328">④ 只保留累加结果，</text>
  <text x="626" y="208" font-size="11" fill="#1f2328">处理下一块</text>
  <rect x="364" y="262" width="396" height="94" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="376" y="284" font-size="12" font-weight="bold" fill="#1f2328">FlashAttention 做的就是这件事</text>
  <text x="376" y="304" font-size="11" fill="#1f2328">把注意力拆成小块，在共享内存和寄存器里边搬边算，</text>
  <text x="376" y="322" font-size="11" fill="#1f2328">不把巨大的中间矩阵写回显存，所以更快、更省显存。</text>
  <text x="376" y="340" font-size="11" fill="#1f2328">新 token 自己的 K、V 算完后追加写入显存里的 KV cache。</text>
</svg>
