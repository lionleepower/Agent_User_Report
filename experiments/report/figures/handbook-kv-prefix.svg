<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <title>KV cache 与前缀复用示意</title>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#1f2328">KV cache 与前缀复用：开头一样的部分不用再算</text>
  <text x="24" y="58" font-size="12" fill="#57606a">每个方块代表一段 token；模型读入时会为每个 token 算出 Key / Value 并暂存，这些暂存就是 KV cache</text>
  <text x="24" y="100" font-size="13" font-weight="bold" fill="#1f2328">请求 1</text>
  <rect x="100" y="82" width="300" height="30" rx="4" fill="#0072B2"/>
  <text x="250" y="102" font-size="12" fill="#ffffff" text-anchor="middle">系统提示 + 资料（稳定前缀）</text>
  <rect x="404" y="82" width="120" height="30" rx="4" fill="#E69F00"/>
  <text x="464" y="102" font-size="12" fill="#1f2328" text-anchor="middle">问题 A</text>
  <text x="540" y="102" font-size="12" fill="#57606a">全部要算（prefill）</text>
  <text x="24" y="160" font-size="13" font-weight="bold" fill="#1f2328">请求 2</text>
  <rect x="100" y="142" width="300" height="30" rx="4" fill="#0072B2" fill-opacity="0.25" stroke="#0072B2"/>
  <text x="250" y="162" font-size="12" fill="#0072B2" text-anchor="middle">同一段稳定前缀 → 命中缓存</text>
  <rect x="404" y="142" width="120" height="30" rx="4" fill="#E69F00"/>
  <text x="464" y="162" font-size="12" fill="#1f2328" text-anchor="middle">问题 B</text>
  <text x="540" y="162" font-size="12" fill="#57606a">只算新问题 → 首字更快</text>
  <text x="24" y="220" font-size="13" font-weight="bold" fill="#1f2328">请求 3</text>
  <rect x="100" y="202" width="36" height="30" rx="4" fill="#D55E00"/>
  <text x="118" y="222" font-size="11" fill="#ffffff" text-anchor="middle">变</text>
  <rect x="140" y="202" width="260" height="30" rx="4" fill="#0072B2"/>
  <text x="270" y="222" font-size="12" fill="#ffffff" text-anchor="middle">后面内容虽然相同……</text>
  <rect x="404" y="202" width="120" height="30" rx="4" fill="#E69F00"/>
  <text x="464" y="222" font-size="12" fill="#1f2328" text-anchor="middle">问题 C</text>
  <text x="540" y="222" font-size="12" fill="#D55E00">开头变了 → 全部重算</text>
  <line x1="24" y1="256" x2="736" y2="256" stroke="#d0d7de"/>
  <text x="24" y="282" font-size="12" fill="#1f2328">• 本地（llama.cpp）：KV 放在显存里，f16 → q8_0 量化可让启动分配量减少约一半（报告 9.1 节实测 46.875%）。</text>
  <text x="24" y="304" font-size="12" fill="#1f2328">• 云端（DeepSeek）：服务商按“命中缓存的 token”打折计费，是计费概念，看不到它的显存（报告 9.2 节）。</text>
  <text x="24" y="326" font-size="12" fill="#1f2328">• 所以提示词要把不变的内容放前面、每次都变的内容（问题、实时转录）放最后。</text>
</svg>
